# BlindVote API — Render Blueprint for the `echo` server repo.
#
# This blueprint creates:
#   - a Docker web service named `echo-fmir`
#   - a Render Postgres database named `blindvote-db`
#
# If your existing Render service is not named `echo-fmir`, change `name` below.
# Render will apply this configuration to the existing service with that name.
#
# After syncing the Blueprint:
#   1. Set DATABASE_URL to the database's External Database URL unless the
#      service and database are in the same region (then use the internal URL).
#   2. Set FRONTEND_URL to your deployed web client.
#   3. Optionally set the email / storage / WebAuthn values.
#   4. The `preDeployCommand` creates/updates the schema automatically.
#
# Paid web services stay warm; the first request after a deploy may take a few seconds.

services:
  - type: web
    name: echo-fmir
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Runs before every deploy. `--force` keeps the first deploy automatic;
    # switch to versioned migrations before treating this as production.
    preDeployCommand: bun run db:push -- --force
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects the *internal* connection string when using fromDatabase.
      # That only works when the web service and database are in the same
      # region/private network. If they are in different regions, paste the
      # database's **External Database URL** here and set DATABASE_SSL=true.
      - key: DATABASE_URL
        sync: false

      # Generate once and keep stable.
      - key: JWT_SECRET
        generateValue: true
      - key: VOTE_ENCRYPTION_KEY
        generateValue: true
      - key: DEVICE_BINDING_PEPPER
        generateValue: true
      - key: REGISTRATION_CODE_PEPPER
        generateValue: true

      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Supabase is now only used for profile-image storage (optional).
      # The database itself lives on Render Postgres.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Optional: email and passkeys.
      - key: EMAIL_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_NAME
        value: BlindVote

      - key: GOVERNANCE_THRESHOLD
        value: "2"
      - key: CHAIN_ENABLED
        value: "false"
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: blindvote-db
    plan: 0.5c-1g
    databaseName: blindvote
    user: blindvote
