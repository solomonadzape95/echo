# BlindVote API — Render Blueprint for the `echo` server repo.
#
# This blueprint creates:
#   - a Docker web service named `echo-fmir`
#   - a Render Postgres database named `blindvote-db`
#
# If your existing Render service is not named `echo-fmir`, change `name` below.
# Render will apply this configuration to the existing service with that name.
#
# After syncing the Blueprint:
#   1. Set FRONTEND_URL to your deployed web client.
#   2. Optionally set the email / storage / WebAuthn values.
#   3. The `preDeployCommand` creates/updates the schema automatically.
#
# Free web services sleep after inactivity; the first request can take 30–60s.

services:
  - type: web
    name: echo-fmir
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Runs before every deploy. `--force` keeps the first deploy automatic;
    # switch to versioned migrations before treating this as production.
    preDeployCommand: bun run db:push -- --force
    envVars:
      - key: NODE_ENV
        value: production

      # Render Postgres. The connection string is injected automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: blindvote-db
          property: connectionString

      # Generate once and keep stable.
      - key: JWT_SECRET
        generateValue: true
      - key: VOTE_ENCRYPTION_KEY
        generateValue: true
      - key: DEVICE_BINDING_PEPPER
        generateValue: true
      - key: REGISTRATION_CODE_PEPPER
        generateValue: true

      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Supabase is now only used for profile-image storage (optional).
      # The database itself lives on Render Postgres.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Optional: email and passkeys.
      - key: EMAIL_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_NAME
        value: BlindVote

      - key: GOVERNANCE_THRESHOLD
        value: "2"
      - key: CHAIN_ENABLED
        value: "false"
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: blindvote-db
    plan: free
    databaseName: blindvote
    user: blindvote
